# Sendell Remote Control — app + Postgres on a VPS
#
# 1) cp .env.example .env   → edit secrets
# 2) docker compose up -d --build
# 3) open http://VPS_IP:8080  (or put Caddy/nginx TLS in front)
#
# From your PC (Grok machine):
#   /remote-sendell CODE
#   hub URL = https://your-domain  (or http://VPS_IP:8080)

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sendell}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-sendell}
    volumes:
      - sendell_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sendell} -d ${POSTGRES_DB:-sendell}"]
      interval: 5s
      timeout: 5s
      retries: 20
    # Not exposed publicly by default (app talks on internal network)
    # ports:
    #   - "5432:5432"

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${SENDELL_PORT:-8080}:8080"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 8080
      DATABASE_URL: postgres://${POSTGRES_USER:-sendell}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-sendell}
      SENDELL_PUBLIC_URL: ${SENDELL_PUBLIC_URL:-}
      SENDELL_MEDIA_DIR: /data/media
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
      BETTER_AUTH_URL: ${SENDELL_PUBLIC_URL:-http://localhost:8080}
    volumes:
      - sendell_media:/data/media
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 5

volumes:
  sendell_pg:
  sendell_media:
